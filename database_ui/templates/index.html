<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('ui_core.static', filename='css/chat.css', v='5') }}">
    <link rel="stylesheet" href="{{ url_for('ui_core.static', filename='css/katex.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/database.css', v='2') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/analytics.css', v='24') }}">
    <style>:root { --accent: {{ accent }}; }</style>
</head>
<body class="review-body">
    <!-- Looks like an empty bar. The current login's access scope is written here
         in the banner's own white, so it's invisible until you select the header
         text (a scoped reviewer shouldn't know the view is filtered). -->
    <header class="course-banner"><span class="course-name scope-hidden">{{ scope_label }}</span></header>

    <button type="button" class="history-toggle" id="history-toggle" aria-label="Open sidebar" title="Open sidebar">
        <svg class="history-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <line x1="9" y1="4" x2="9" y2="20"/>
        </svg>
    </button>

    <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
        <div class="sidebar-inner">
            <div class="sidebar-header">
                <h2 class="sidebar-title">AskTIM <span class="beta-tag">· Database Beta+</span></h2>
                <button type="button" class="sidebar-close" id="sidebar-close" aria-label="Close sidebar" title="Close sidebar">
                    <svg class="sidebar-close-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="16" rx="2"/>
                        <line x1="9" y1="4" x2="9" y2="20"/>
                    </svg>
                </button>
            </div>
            <button type="button" class="sidebar-cta sidebar-cta-primary" id="download-open">
                <svg class="sidebar-cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                <span>Download data</span>
            </button>
            <a href="/analytics" class="sidebar-cta sidebar-cta-primary" id="weekly-report-open">
                <svg class="sidebar-cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                    <line x1="6" y1="20" x2="6" y2="14"/>
                </svg>
                <span>Weekly report</span>
            </a>
            <div class="sidebar-empty" id="sidebar-empty" hidden></div>
            <ul class="sidebar-list" id="sidebar-list"></ul>
        </div>
    </aside>

    <main class="chat review-chat">
        <ol class="message-list" id="message-list" aria-live="polite" aria-label="Conversation">
            <li class="review-placeholder" id="review-placeholder">AskTIM Database is here to help</li>
        </ol>
        <!-- Weekly report renders in-place here (same box as the transcript), so
             the sidebar and top banner stay put. Starts hidden; the "Weekly
             report" button swaps it in and a conversation click swaps it out.
             The button's href="/analytics" is the no-JS fallback. -->
        <section class="analytics-panel" id="analytics-panel" aria-live="polite" hidden>
            <div class="analytics-bar">
                <div class="weekpick" id="week-picker">
                    <button type="button" class="weekpick-trigger" id="weekpick-trigger"
                            aria-haspopup="dialog" aria-expanded="false" aria-label="Select week">
                        <span class="weekpick-label" id="weekpick-label">Select week</span>
                        <svg class="weekpick-caret" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <span id="analytics-status" class="analytics-status"></span>
            </div>
            <div id="analytics-content" class="analytics-content"></div>
        </section>
        <div class="error-banner" id="error-banner" role="alert" hidden>
            <span class="error-text" id="error-text"></span>
            <button class="error-dismiss" id="error-dismiss" type="button" aria-label="Dismiss error">&times;</button>
        </div>
    </main>
    </div>

    <div class="modal-overlay" id="download-modal" role="dialog" aria-modal="true"
         aria-labelledby="download-modal-title" hidden>
        <div class="modal-card">
            <h2 id="download-modal-title" class="modal-title">Configure the export settings</h2>
            <p id="download-step-label" class="modal-body"></p>
            <form id="download-form" class="modal-form" autocomplete="off">
                <div id="download-step-body" class="create-step-body"></div>
                <div class="modal-error" id="download-error" role="alert" hidden></div>
                <div class="modal-actions create-actions">
                    <button type="button" id="download-cancel" class="modal-skip">Cancel</button>
                    <span class="create-actions-right">
                        <button type="button" id="download-back" class="modal-skip" hidden>Back</button>
                        <button type="submit" id="download-next" class="modal-submit">Continue</button>
                    </span>
                </div>
            </form>
        </div>
    </div>

    <!-- Markdown rendering for tutor messages: marked parses GFM (incl. tables),
         DOMPurify sanitizes the HTML. Vendored locally; loaded before database.js. -->
    <script src="{{ url_for('ui_core.static', filename='js/katex.min.js') }}" defer></script>
    <script src="{{ url_for('ui_core.static', filename='js/katex-marked.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/marked.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/dompurify.min.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/analytics.js', v='37') }}" defer></script>
    <script src="{{ url_for('static', filename='js/database.js', v='7') }}" defer></script>
    <script src="{{ url_for('static', filename='js/download.js', v='1') }}" defer></script>
</body>
</html>
