# .github/workflows/weekly-analytics.yml
name: Weekly analytics report

on:
  # AUTOMATIC SCHEDULE INTENTIONALLY DISABLED. We run each week manually, one at
  # a time, watching cost between runs. Re-enable by uncommenting the cron below.
  # schedule:
  #   # Sunday 08:00 UTC ≈ 03:00–04:00 America/New_York — right after the Sun–Sat
  #   # week closes at Saturday midnight ET, so the report covers the full week.
  #   - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      week:
        description: "Any date (YYYY-MM-DD) inside the target week; blank = previous complete week"
        required: false
        default: ""
      max_convos:
        description: "Cap conversations judged (blank = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-analytics
  cancel-in-progress: false

env:
  TARGET_BRANCH: prod-beta-plus

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly report
        id: gen
        env:
          DATABASE_UI_DATABASE_URL: ${{ secrets.ANALYTICS_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYTICS_JUDGE_MODEL: ${{ vars.ANALYTICS_JUDGE_MODEL || 'claude-sonnet-4-6' }}
          # Pass dispatch inputs through the environment (never interpolated into
          # the shell) so a crafted `week`/`max_convos` value can't inject commands
          # into a step that holds the DB URL and API key.
          INPUT_WEEK: ${{ github.event.inputs.week }}
          INPUT_MAX_CONVOS: ${{ github.event.inputs.max_convos }}
        run: |
          ARGS=()
          if [ -n "$INPUT_WEEK" ]; then ARGS+=(--week "$INPUT_WEEK"); fi
          if [ -n "$INPUT_MAX_CONVOS" ]; then ARGS+=(--max-convos "$INPUT_MAX_CONVOS"); fi
          python -m database_ui.analytics.weekly "${ARGS[@]}" --report-out /tmp/report.md
          # Surface the week key (cache filename stem) for the commit message.
          echo "week_key=$(ls -t database_ui/analytics/cache/*.json | head -1 | xargs -n1 basename | sed 's/.json//')" >> "$GITHUB_OUTPUT"

      - name: Open and merge report-cache PR to prod-beta-plus
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.gen.outputs.week_key }}
        run: |
          git config user.name "asktim-bot"
          git config user.email "asktim-bot@users.noreply.github.com"
          git add database_ui/analytics/cache/
          if git diff --cached --quiet; then
            echo "No cache changes; nothing to deploy."
            exit 0
          fi
          BRANCH="analytics/weekly-${WEEK}"
          git checkout -b "$BRANCH"
          git commit -m "chore(analytics): weekly report cache for ${WEEK}"
          git push --force-with-lease origin "$BRANCH"
          # 0 required approvals on the ruleset => the bot can merge its own PR.
          gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "chore(analytics): weekly report cache for ${WEEK}" \
            --body "Automated weekly analytics cache for week ${WEEK}. Merges on creation."
          # Retry: right after creation GitHub may still report the PR's mergeable
          # state as UNKNOWN, which makes an immediate `gh pr merge` fail.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$BRANCH" --squash --delete-branch; then
              exit 0
            fi
            echo "merge attempt ${attempt} failed (mergeability may still be computing); retrying in 15s"
            sleep 15
          done
          echo "::error::PR merge failed after 5 attempts for ${BRANCH}"
          exit 1
